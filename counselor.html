<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أرشديني للمرشدة</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Caveat:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Lalezar&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="i18n.js"></script>
<style>
  .view-wrap { padding-block: clamp(28px, 6vw, 56px); }
  .auth { max-width: 480px; margin-inline: auto; display: grid; gap: 18px; }
  .auth h1, .dash-head h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.9rem, 4vw, 2.4rem); }
  .auth .sub { color: var(--muted); }
  .auth form { display: grid; gap: 16px; }

  .dash { display: grid; gap: 22px; }
  .dash-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .dash-head p { color: var(--muted); }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 18px; display: grid; min-width: 120px; }
  .stat b { font-family: var(--f-display); font-weight: 400; font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: .85rem; }
  .stat.is-new b { color: var(--wait); }

  .tabs { display: flex; gap: 6px; background: var(--surface-2); border-radius: 999px; padding: 5px; width: max-content; max-width: 100%; overflow-x: auto; }
  .tab { border: 0; background: transparent; border-radius: 999px; padding: 8px 18px; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--muted); }
  .tab[aria-selected="true"] { background: var(--surface); color: var(--accent-ink); box-shadow: var(--shadow); }
  .toolbar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }

  .q-card.is-new { border-inline-start: 4px solid var(--spark); }
  .reply-form { display: grid; gap: 10px; }
  .reply-form .textarea { min-height: 110px; }
  .reply-actions { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
  .reply-actions .form-error { min-height: 0; }
  .anon { font-size: .82rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  .anon svg { width: 15px; height: 15px; }

  /* ---------- Top-level sections ---------- */
  .ctabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); overflow-x: auto; margin-bottom: 22px; }
  .ctab { border: 0; background: transparent; padding: 10px 16px; font-weight: 700; cursor: pointer; color: var(--muted); white-space: nowrap;
    border-bottom: 3px solid transparent; margin-bottom: -2px; display: inline-flex; gap: 8px; align-items: center; font-size: 1rem; }
  .ctab[aria-selected="true"] { color: var(--accent-ink); border-bottom-color: var(--accent); }
  .ctab .badge:empty { display: none; }
  /* شريط التمرير يختفي (يظهر في ويندوز لما تكون التبويبات أعرض أو أطول بشوي) */
  .ctabs, .tabs { overflow-y: hidden; scrollbar-width: none; -ms-overflow-style: none; }
  .ctabs::-webkit-scrollbar, .tabs::-webkit-scrollbar { display: none; }

  /* ---------- Values admin ---------- */
  .cv-layout { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 24px; align-items: start; }
  .cv-form { display: grid; gap: 14px; position: sticky; top: calc(84px + env(safe-area-inset-top, 0px)); }
  .cv-form h2, .cv-list h2 { font-size: 1.25rem; font-weight: 700; }
  .cv-form .textarea { min-height: 90px; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; border: 0; padding: 0; margin: 0; }
  .swatches legend { font-weight: 600; font-size: .95rem; margin-bottom: 8px; padding: 0; }
  .swatch { position: relative; }
  .swatch input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .swatch span { display: block; width: 36px; height: 36px; border-radius: 50%; background: var(--vc); border: 2px solid var(--line); }
  .swatch input:checked + span { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  .swatch input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
  .form-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .cv-list { display: grid; gap: 14px; min-width: 0; }
  .cv-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; display: grid; grid-template-columns: 10px 1fr; }
  .cv-item.is-editing { border-color: var(--accent); }
  .cv-stripe { background: var(--vc); }
  .cv-main { padding: 14px 18px; display: grid; gap: 8px; min-width: 0; }
  .cv-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
  .cv-head h3 { font-size: 1.15rem; font-weight: 700; overflow-wrap: anywhere; }
  .cv-meta { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cv-main .v-brief { color: var(--muted); font-size: .92rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .cv-beh { margin: 0; padding-inline-start: 18px; font-size: .9rem; display: grid; gap: 2px; }
  .cv-acts { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ---------- Works admin ---------- */
  .wa-list { display: grid; gap: 14px; }
  .wa-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; display: grid; grid-template-columns: 180px minmax(0, 1fr); }
  .wa-card.is-pending { border-inline-start: 4px solid var(--spark); }
  .wa-card .w-media { aspect-ratio: auto; min-height: 140px; height: 100%; }
  .wa-body { padding: 14px 18px; display: grid; gap: 8px; align-content: start; }
  .wa-top { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .wa-body h3 { font-size: 1.1rem; font-weight: 700; overflow-wrap: anywhere; }
  .wa-desc { color: var(--muted); font-size: .92rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .wa-acts { display: flex; gap: 6px; flex-wrap: wrap; }

  @media (max-width: 860px) {
    .cv-layout { grid-template-columns: 1fr; }
    .cv-form { position: static; }
  }
  @media (max-width: 560px) {
    .wa-card { grid-template-columns: 1fr; }
    .wa-card .w-media { aspect-ratio: 16 / 9; min-height: 0; }
  }
</style>
</head>
<body data-title-key="page.counselorTitle">

<div class="demo-bar" id="demoBar" hidden></div>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html" data-i18n-aria="c.back">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs><clipPath id="logoHeart"><path d="M32 59 9.5 36.5C2.5 29.5 2 18.5 8.5 12.8 15 7 25 8.6 29.6 16.4L32 20.4l2.4-4C39 8.6 49 7 55.5 12.8 62 18.5 61.5 29.5 54.5 36.5Z"/></clipPath></defs>
        <g clip-path="url(#logoHeart)">
          <rect class="l-deep" width="64" height="64"/>
          <path class="l-mid" d="M33 0H64V43C57 36.5 47 36 39 40.5 31 45 22 50 16.5 64H0V45C6 33 18 27.5 31 24.5Z"/>
          <path class="l-road" d="M33 20C30 24 22.5 25.5 24 30 25.5 34.5 39.5 33.5 37.5 39.5 35.5 45.5 21 47 17 60" fill="none" stroke-width="4.6" stroke-linecap="round"/>
        </g>
        <path class="l-pole" d="M32.6 22V4.6" stroke-width="2.2" stroke-linecap="round"/>
        <circle class="l-knob" cx="32.6" cy="4.2" r="2"/>
        <path class="l-flag" d="M34.2 5.6C38 3.4 41 7.2 46.5 5.4 45.4 9.6 42.4 11.6 38.6 11.4 36.6 11.3 35.4 12 34.2 13Z"/>
      </svg>
      <span><span class="brand-name" data-i18n="brand.name">أرشديني</span><span class="brand-tag" data-i18n="c.brandTag"></span></span>
    </a>
    <div class="header-actions" style="margin-inline-start:auto">
      <div class="toggles">
        <button class="lang-btn" type="button" id="langToggle">English</button>
        <button class="icon-btn" type="button" id="themeToggle">
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          <svg class="i-sun" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
      <button class="btn btn-ghost" type="button" id="logoutBtn" hidden data-i18n="btn.logout"></button>
    </div>
  </div>
</header>

<main>
  <!-- ================= دخول المرشدة ================= -->
  <section id="loginView" hidden>
    <div class="wrap view-wrap">
      <div class="auth panel">
        <div>
          <h1 data-i18n="c.loginTitle"></h1>
          <p class="sub" data-i18n="c.loginSub"></p>
        </div>
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="c-email" data-i18n="c.email"></label>
            <input class="input" id="c-email" type="email" dir="ltr" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="c-password" data-i18n="login.pass"></label>
            <input class="input" id="c-password" type="password" dir="ltr" autocomplete="current-password" required>
          </div>
          <p class="form-error" id="loginError" role="alert"></p>
          <button class="btn btn-primary btn-lg" type="submit" id="loginBtn" data-i18n="login.btn"></button>
        </form>
      </div>
    </div>
  </section>

  <!-- ================= اللوحة ================= -->
  <section id="dashView" hidden>
    <div class="wrap view-wrap">
      <div class="dash">
        <div class="dash-head">
          <div>
            <h1 data-i18n="c.hello"></h1>
            <p data-i18n="c.helloSub"></p>
          </div>
          <div class="stats">
            <div class="stat is-new"><b id="sNew">0</b><span data-i18n="c.tabNew"></span></div>
            <div class="stat"><b id="sDone">0</b><span data-i18n="c.tabDone"></span></div>
          </div>
        </div>

        <div class="toolbar">
          <div class="tabs" role="tablist" data-i18n-aria="c.tabs">
            <button class="tab" role="tab" data-filter="new" aria-selected="true" data-i18n="c.tabNew"></button>
            <button class="tab" role="tab" data-filter="answered" aria-selected="false" data-i18n="c.tabDone"></button>
            <button class="tab" role="tab" data-filter="all" aria-selected="false" data-i18n="c.tabAll"></button>
          </div>
          <button class="btn btn-ghost" type="button" id="refreshBtn" data-i18n="btn.refresh"></button>
        </div>

        <div class="q-list" id="list" aria-live="polite"></div>
      </div>

    </div>
  </section>
</main>

<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  let questions = [];
  let loaded = false;
  let filter = "new";
  const editing = new Set(); // أسئلة مفتوحة لتعديل الرد

  function paintDemoBar() {
    if (Api.mode !== "demo") return;
    const bar = $("#demoBar"); bar.hidden = false;
    bar.innerHTML = t("c.demo", { e: Api.demoCounselor.email, p: Api.demoCounselor.password });
  }
  paintDemoBar();

  function toast(msg) {
    const el = $("#toast"); el.textContent = msg; el.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(() => (el.hidden = true), 2600);
  }
  function show(which) {
    $("#loginView").hidden = which !== "login";
    $("#dashView").hidden = which !== "dash";
    $("#logoutBtn").hidden = which !== "dash";
  }

  $("#loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("#loginError"); err.textContent = "";
    const btn = $("#loginBtn"); btn.disabled = true; btn.textContent = t("login.busy");
    try {
      await Api.signInCounselor($("#c-email").value, $("#c-password").value);
      e.target.reset(); show("dash"); load();
    } catch (ex) { err.textContent = ex.message; }
    finally { btn.disabled = false; btn.textContent = t("login.btn"); }
  });

  $("#logoutBtn").addEventListener("click", async () => {
    await Api.signOut(); questions = []; loaded = false; show("login"); toast(t("toast.loggedOut"));
  });

  document.querySelectorAll(".tab").forEach(tb => tb.addEventListener("click", () => {
    filter = tb.dataset.filter;
    document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", String(x === tb)));
    render();
  }));
  $("#refreshBtn").addEventListener("click", load);


  async function load() {
    $("#list").innerHTML = `<div class="empty">${t("loading")}</div>`;
    try { questions = await Api.allQuestions(); loaded = true; render(); }
    catch (ex) { $("#list").innerHTML = `<div class="empty">${escapeHtml(ex.message)}</div>`; }
  }

  const anonIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;

  function render() {
    if (!loaded) return;
    const nNew = questions.filter(q => q.status !== "answered").length;
    $("#sNew").textContent = nNew;
    $("#sDone").textContent = questions.length - nNew;

    const shown = questions.filter(q => filter === "all" || (filter === "new" ? q.status !== "answered" : q.status === "answered"));
    if (!shown.length) {
      $("#list").innerHTML = filter === "new"
        ? `<div class="empty"><span class="hand">${t("c.emptyNewT")}</span>${t("c.emptyNewB")}</div>`
        : `<div class="empty">${t("c.empty")}</div>`;
      return;
    }
    $("#list").innerHTML = shown.map(card).join("");

    document.querySelectorAll("[data-reply-form]").forEach(f => f.addEventListener("submit", onReply));
    document.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => {
      editing.add(Number(b.dataset.edit)); render();
      const ta = document.getElementById("r-" + b.dataset.edit); if (ta) ta.focus();
    }));
    document.querySelectorAll("[data-cancel]").forEach(b => b.addEventListener("click", () => {
      editing.delete(Number(b.dataset.cancel)); render();
    }));
  }

  function card(q) {
    const answered = q.status === "answered";
    const isEditing = editing.has(q.id);
    const replyBlock = answered && !isEditing
      ? `<div class="q-reply">
           <span class="who-replied">${t("c.yourReply")}${q.replied_at ? " · " + escapeHtml(formatDate(q.replied_at)) : ""}</span>
           <p dir="auto">${escapeHtml(q.reply)}</p>
         </div>
         <div><button class="btn btn-soft" type="button" data-edit="${q.id}">${t("c.edit")}</button></div>`
      : `<form class="reply-form" data-reply-form data-id="${q.id}" novalidate>
           <label class="field" for="r-${q.id}" style="gap:6px">
             <span style="font-weight:600;font-size:.95rem">${answered ? t("c.edit") : t("c.write")}</span>
             <textarea class="textarea" id="r-${q.id}" maxlength="4000" required dir="auto">${answered ? escapeHtml(q.reply) : ""}</textarea>
           </label>
           <div class="reply-actions">
             <p class="form-error" data-err></p>
             <div style="display:flex;gap:8px">
               ${isEditing ? `<button class="btn btn-ghost" type="button" data-cancel="${q.id}">${t("c.cancel")}</button>` : ""}
               <button class="btn btn-primary" type="submit">${answered ? t("c.save") : t("c.send")}</button>
             </div>
           </div>
         </form>`;
    return `
      <article class="q-card ${answered ? "" : "is-new"}">
        <div class="q-meta">
          <span class="anon">${anonIcon} ${t("c.anon")} · ${escapeHtml(formatDate(q.created_at))}</span>
          ${answered ? `<span class="chip chip-done">${t("status.done")}</span>` : `<span class="chip chip-new">${t("status.new")}</span>`}
        </div>
        <p class="q-body" dir="auto">${escapeHtml(q.body)}</p>
        ${replyBlock}
      </article>`;
  }

  async function onReply(e) {
    e.preventDefault();
    const form = e.target, id = Number(form.dataset.id);
    const ta = form.querySelector("textarea"), err = form.querySelector("[data-err]"), btn = form.querySelector("[type=submit]");
    err.textContent = ""; btn.disabled = true;
    try {
      await Api.reply(id, ta.value);
      editing.delete(id);
      toast(t("toast.replied"));
      await load();
    } catch (ex) { err.textContent = ex.message; btn.disabled = false; }
  }

  window.addEventListener("langchange", () => {
    paintDemoBar();
    $("#loginError").textContent = "";
    // نحفظ أي رد مكتوب قبل إعادة الرسم
    const drafts = {};
    document.querySelectorAll(".reply-form textarea").forEach(ta => (drafts[ta.id] = ta.value));
    render();
    for (const id in drafts) { const ta = document.getElementById(id); if (ta) ta.value = drafts[id]; }
  });

  (async () => {
    let ok = false;
    try { ok = (await Api.currentUser()) && (await Api.isCounselor()); } catch (e) {}
    if (ok) { show("dash"); load(); } else { show("login"); }
  })();
})();
</script>
</body>
</html>
