<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أرشديني</title>
<meta name="description" content="اكتبي سؤالكِ لمرشدة المدرسة بسرية تامة، بدون اسم أو إيميل أو رقم جوال.">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Caveat:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Lalezar&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="i18n.js"></script>
<style>
  /* ---------- Home ---------- */
  .hero { padding-block: clamp(28px, 6vw, 64px); }
  .hero .wrap { display: grid; grid-template-columns: 1fr 1.15fr; gap: clamp(24px, 4vw, 56px); align-items: center; }
  .hero-text { display: grid; gap: 20px; min-width: 0; }
  .hero h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.6rem, 6.4vw, 4.6rem); line-height: 1.25; color: var(--ink); }
  :lang(en) .hero h1 { font-size: clamp(2.1rem, 4.6vw, 3.3rem); line-height: 1.2; }
  .hero .lead { font-size: 1.12rem; color: var(--muted); max-width: 36ch; }
  .hero-cta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .trust { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: .92rem; }
  .trust svg { width: 18px; height: 18px; color: var(--accent-ink); flex: none; }
  .hero-art { min-width: 0; }
  .hero-art img { width: 100%; aspect-ratio: 1000 / 456; object-fit: cover; border-radius: var(--r-lg); box-shadow: var(--shadow); }

  .section { padding-block: clamp(40px, 7vw, 80px); }
  .section-head { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; flex-wrap: wrap; }
  .bubble {
    font-family: var(--f-display); font-weight: 400; font-size: clamp(1.7rem, 3.4vw, 2.3rem);
    background: var(--lilac); padding: 6px 22px 10px; border-radius: 22px; border-end-start-radius: 6px; color: var(--ink);
  }
  .section-head .hand { font-size: 1.2rem; }

  .services { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .service { text-align: center; display: grid; justify-items: center; align-content: start; gap: 8px; padding: 8px; }
  .blob { width: 96px; height: 88px; display: grid; place-items: center; border-radius: 48% 52% 46% 54% / 55% 45% 55% 45%; margin-bottom: 6px; }
  .blob svg { width: 40px; height: 40px; color: var(--accent-ink); }
  .b-sky { background: var(--sky); } .b-peach { background: var(--peach); } .b-mint { background: var(--mint); } .b-lilac { background: var(--lilac); }
  .service h3 { font-size: 1.15rem; font-weight: 700; }
  .service p { color: var(--muted); font-size: .95rem; max-width: 26ch; }

  .how { background: var(--surface-2); border-radius: var(--r-lg); padding: clamp(24px, 4vw, 48px); }
  .steps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; counter-reset: s; }
  .steps li { background: var(--surface); border-radius: var(--r-md); padding: 22px; display: grid; gap: 8px; align-content: start; counter-increment: s; }
  .steps li::before {
    content: counter(s, arabic-indic); font-family: var(--f-display); font-size: 1.6rem; width: 46px; height: 46px; line-height: 50px;
    text-align: center; border-radius: 50%; background: var(--accent); color: var(--on-accent);
  }
  :lang(en) .steps li::before { content: counter(s); line-height: 48px; }
  .steps h3 { font-size: 1.1rem; font-weight: 700; }
  .steps p { color: var(--muted); font-size: .95rem; }

  .who-band { display: grid; grid-template-columns: 1.2fr 1fr auto; gap: 28px; align-items: center; }
  .who-band .grad { display: flex; gap: 16px; align-items: center; }
  .who-band .grad svg { width: 64px; height: 64px; color: var(--accent-ink); flex: none; }
  .who-band h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.8rem; }
  .who-band p { color: var(--muted); }
  .quote { background: var(--surface); border-radius: 30px; padding: 22px 26px; box-shadow: var(--shadow); font-weight: 600; font-size: 1.05rem; text-align: center; }
  .who-band .sticky-note { transform: rotate(-3deg); }
  :lang(en) .who-band .sticky-note { transform: rotate(3deg); }

  .faq { display: grid; gap: 12px; max-width: 780px; margin-inline: auto; }
  #faq .section-head { justify-content: center; }
  .faq details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 4px 20px; }
  .faq summary { cursor: pointer; font-weight: 700; padding-block: 14px; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; font-size: 1.4rem; line-height: 1; color: var(--accent-ink); }
  .faq details[open] summary::after { content: "−"; }
  .faq details p { padding-bottom: 16px; color: var(--muted); }
  .urgent-band { margin-top: 40px; max-width: 780px; margin-inline: auto; }

  /* ---------- Auth & app views ---------- */
  .view-wrap { padding-block: clamp(28px, 6vw, 56px); }
  .auth { max-width: 520px; margin-inline: auto; display: grid; gap: 18px; }
  .auth h1, .app-head h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.9rem, 4vw, 2.4rem); }
  .auth .sub { color: var(--muted); }
  .auth form { display: grid; gap: 16px; }
  .switch { text-align: center; color: var(--muted); font-size: .95rem; }

  .creds { background: var(--surface-2); border-radius: var(--r-md); padding: 18px; display: grid; gap: 10px; }
  .cred-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
  .cred-row span { color: var(--muted); font-size: .9rem; }
  .cred-row code { font-family: ui-monospace, monospace; font-size: 1.1rem; direction: ltr; unicode-bidi: isolate; background: var(--surface); padding: 4px 10px; border-radius: 8px; overflow-wrap: anywhere; }

  .app { max-width: 820px; margin-inline: auto; display: grid; gap: 24px; }
  .app-head p { color: var(--muted); }
  .ask-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .list-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .list-head h2 { font-size: 1.25rem; font-weight: 700; }

  @media (max-width: 900px) {
    .hero .wrap { grid-template-columns: 1fr; }
    .hero-art { order: -1; }
    .services { grid-template-columns: repeat(2, 1fr); }
    .who-band { grid-template-columns: 1fr; }
    .who-band .sticky-note { justify-self: center; }
  }
  @media (max-width: 640px) { .steps { grid-template-columns: 1fr; } }
  @media (max-width: 420px) { .services { grid-template-columns: 1fr; } }
</style>
</head>
<body data-title-key="page.title">

<div class="demo-bar" id="demoBar" hidden data-i18n-html="demo.bar"></div>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="#home" data-i18n-aria="brand.home">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs><clipPath id="logoHeart"><path d="M32 59 9.5 36.5C2.5 29.5 2 18.5 8.5 12.8 15 7 25 8.6 29.6 16.4L32 20.4l2.4-4C39 8.6 49 7 55.5 12.8 62 18.5 61.5 29.5 54.5 36.5Z"/></clipPath></defs>
        <g clip-path="url(#logoHeart)">
          <rect class="l-deep" width="64" height="64"/>
          <path class="l-mid" d="M33 0H64V43C57 36.5 47 36 39 40.5 31 45 22 50 16.5 64H0V45C6 33 18 27.5 31 24.5Z"/>
          <path class="l-road" d="M33 20C30 24 22.5 25.5 24 30 25.5 34.5 39.5 33.5 37.5 39.5 35.5 45.5 21 47 17 60" fill="none" stroke-width="4.6" stroke-linecap="round"/>
        </g>
        <path class="l-pole" d="M32.6 22V4.6" stroke-width="2.2" stroke-linecap="round"/>
        <circle class="l-knob" cx="32.6" cy="4.2" r="2"/>
        <path class="l-flag" d="M34.2 5.6C38 3.4 41 7.2 46.5 5.4 45.4 9.6 42.4 11.6 38.6 11.4 36.6 11.3 35.4 12 34.2 13Z"/>
      </svg>
      <span><span class="brand-name" data-i18n="brand.name">أرشديني</span><span class="brand-tag" data-i18n="brand.tag">Guide me · استشاراتكِ سرّية دائمًا</span></span>
    </a>
    <nav class="nav" data-i18n-aria="nav.label">
      <a href="#home" data-nav="home" data-i18n="nav.home">الرئيسية</a>
      <a href="#services" data-nav="services" data-i18n="nav.services">الخدمات</a>
      <a href="#how" data-nav="how" data-i18n="nav.how">كيف يعمل؟</a>
      <a href="#faq" data-nav="faq" data-i18n="nav.faq">الأسئلة الشائعة</a>
    </nav>
    <div class="header-actions">
      <div class="toggles">
        <button class="lang-btn" type="button" id="langToggle">English</button>
        <button class="icon-btn" type="button" id="themeToggle">
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          <svg class="i-sun" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
      <div class="header-actions" id="authActions"></div>
    </div>
  </div>
</header>

<main id="main">

  <!-- ================= الصفحة الرئيسية ================= -->
  <section data-view="home">
    <div class="hero">
      <div class="wrap">
        <div class="hero-text">
          <h1><span data-i18n="hero.t1">لأنكِ تستحقين</span><br><span class="mark" data-i18n="hero.t2">من يسمعكِ</span></h1>
          <p class="lead" data-i18n="hero.lead"></p>
          <div class="hero-cta">
            <a class="btn btn-primary btn-lg" href="#signup" data-cta>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              <span data-i18n="hero.cta">اكتبي سؤالكِ بسرية</span>
            </a>
            <span class="hand" style="font-size:1.15rem" data-i18n="hero.hand"></span>
          </div>
          <p class="trust">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <span data-i18n="hero.trust"></span>
          </p>
        </div>
        <div class="hero-art">
          <img src="assets/hero.webp" data-i18n-alt="hero.alt" alt="" width="1000" height="456">
        </div>
      </div>
    </div>

    <div class="section" id="services">
      <div class="wrap">
        <div class="section-head">
          <h2 class="bubble" data-i18n="svc.head"></h2>
          <span class="hand" data-i18n="svc.hand"></span>
        </div>
        <div class="services">
          <div class="service">
            <div class="blob b-sky"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><rect x="9" y="11" width="6" height="5" rx="1"/><path d="M10 11V9.5a2 2 0 0 1 4 0V11"/></svg></div>
            <h3 data-i18n="svc.1t"></h3><p data-i18n="svc.1d"></p>
          </div>
          <div class="service">
            <div class="blob b-peach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M5 5h11l3 3-3 3H5zM19 13H8l-3 3 3 3h11z"/></svg></div>
            <h3 data-i18n="svc.2t"></h3><p data-i18n="svc.2d"></p>
          </div>
          <div class="service">
            <div class="blob b-mint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/><path d="m16 8 5-5M18 3h3v3"/></svg></div>
            <h3 data-i18n="svc.3t"></h3><p data-i18n="svc.3d"></p>
          </div>
          <div class="service">
            <div class="blob b-lilac"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg></div>
            <h3 data-i18n="svc.4t"></h3><p data-i18n="svc.4d"></p>
          </div>
        </div>
      </div>
    </div>

    <div class="section" id="how" style="padding-top:0">
      <div class="wrap">
        <div class="how">
          <div class="section-head">
            <h2 class="bubble" style="background:var(--surface)" data-i18n="how.head"></h2>
            <span class="hand" data-i18n="how.hand"></span>
          </div>
          <ol class="steps">
            <li><h3 data-i18n="how.1t"></h3><p data-i18n="how.1d"></p></li>
            <li><h3 data-i18n="how.2t"></h3><p data-i18n="how.2d"></p></li>
            <li><h3 data-i18n="how.3t"></h3><p data-i18n="how.3d"></p></li>
          </ol>
        </div>
      </div>
    </div>

    <div class="section" style="padding-top:0">
      <div class="wrap who-band">
        <div class="grad">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9 12 4l10 5-10 5Z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/><path d="M22 9v6"/></svg>
          <div>
            <h2 data-i18n="who.title"></h2>
            <p data-i18n="who.desc"></p>
          </div>
        </div>
        <p class="quote" data-i18n-html="who.quote"></p>
        <div class="sticky-note" data-i18n-html="who.note"></div>
      </div>
    </div>

    <div class="section" id="faq" style="padding-top:0">
      <div class="wrap">
        <div class="section-head"><h2 class="bubble" data-i18n="faq.head"></h2></div>
        <div class="faq">
          <details><summary data-i18n="faq.q1"></summary><p data-i18n="faq.a1"></p></details>
          <details><summary data-i18n="faq.q2"></summary><p data-i18n="faq.a2"></p></details>
          <details><summary data-i18n="faq.q3"></summary><p data-i18n="faq.a3"></p></details>
          <details><summary data-i18n="faq.q4"></summary><p data-i18n="faq.a4"></p></details>
          <details><summary data-i18n="faq.q5"></summary><p data-i18n="faq.a5"></p></details>
        </div>

        <div class="notice urgent-band" role="note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
          <p><strong data-i18n="urgent.title"></strong><span data-i18n="urgent.home"></span></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= إنشاء حساب ================= -->
  <section data-view="signup" hidden>
    <div class="wrap view-wrap">
      <div class="auth panel">
        <div>
          <h1 data-i18n="signup.title"></h1>
          <p class="sub" data-i18n="signup.sub"></p>
        </div>
        <form id="signupForm" novalidate>
          <div class="field">
            <label for="su-username" data-i18n="signup.user"></label>
            <input class="input" id="su-username" dir="ltr" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="20" required placeholder="moon_light">
            <span class="hint" data-i18n="signup.userHint"></span>
          </div>
          <div class="field">
            <label for="su-password" data-i18n="signup.pass"></label>
            <input class="input" id="su-password" type="password" dir="ltr" autocomplete="new-password" minlength="8" required>
            <span class="hint" data-i18n="signup.passHint"></span>
          </div>
          <div class="field">
            <label for="su-password2" data-i18n="signup.pass2"></label>
            <input class="input" id="su-password2" type="password" dir="ltr" autocomplete="new-password" minlength="8" required>
          </div>

          <div class="notice" role="note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
            <p><strong data-i18n="warn.title"></strong><span data-i18n-html="warn.body"></span></p>
          </div>

          <label class="check" for="su-agree">
            <input type="checkbox" id="su-agree" required>
            <span data-i18n="signup.agree"></span>
          </label>

          <p class="form-error" id="signupError" role="alert"></p>
          <button class="btn btn-primary btn-lg" type="submit" id="signupBtn" data-i18n="signup.btn"></button>
        </form>
        <p class="switch"><span data-i18n="signup.have"></span> <a href="#login" data-i18n="signup.loginLink"></a></p>
      </div>
    </div>
  </section>

  <!-- ================= بعد التسجيل: احفظي بياناتكِ ================= -->
  <section data-view="welcome" hidden>
    <div class="wrap view-wrap">
      <div class="auth panel">
        <div>
          <h1 data-i18n="welcome.title"></h1>
          <p class="sub" data-i18n="welcome.sub"></p>
        </div>
        <div class="creds">
          <div class="cred-row"><span data-i18n="welcome.user"></span><code id="wUser"></code></div>
          <div class="cred-row"><span data-i18n="welcome.pass"></span><code id="wPass">••••••••</code></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-soft" type="button" id="togglePass"></button>
            <button class="btn btn-soft" type="button" id="copyCreds" data-i18n="welcome.copy"></button>
          </div>
        </div>
        <label class="check" for="w-saved">
          <input type="checkbox" id="w-saved">
          <span data-i18n="welcome.saved"></span>
        </label>
        <button class="btn btn-primary btn-lg" type="button" id="wContinue" disabled data-i18n="welcome.continue"></button>
      </div>
    </div>
  </section>

  <!-- ================= تسجيل الدخول ================= -->
  <section data-view="login" hidden>
    <div class="wrap view-wrap">
      <div class="auth panel">
        <div>
          <h1 data-i18n="login.title"></h1>
          <p class="sub" data-i18n="login.sub"></p>
        </div>
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="li-username" data-i18n="login.user"></label>
            <input class="input" id="li-username" dir="ltr" autocomplete="username" autocapitalize="off" spellcheck="false" required>
          </div>
          <div class="field">
            <label for="li-password" data-i18n="login.pass"></label>
            <input class="input" id="li-password" type="password" dir="ltr" autocomplete="current-password" required>
          </div>
          <p class="form-error" id="loginError" role="alert"></p>
          <button class="btn btn-primary btn-lg" type="submit" id="loginBtn" data-i18n="login.btn"></button>
        </form>
        <p class="switch"><span data-i18n="login.no"></span> <a href="#signup" data-i18n="login.signupLink"></a></p>
      </div>
    </div>
  </section>

  <!-- ================= أسئلتي ================= -->
  <section data-view="my" hidden>
    <div class="wrap view-wrap">
      <div class="app">
        <div class="app-head">
          <h1 data-i18n="my.title"></h1>
          <p><span data-i18n="my.hello1"></span> <b id="myName" dir="ltr"></b><span data-i18n="my.hello2"></span></p>
        </div>

        <form class="panel" id="askForm" novalidate style="display:grid;gap:14px">
          <div class="field">
            <label for="ask-body" data-i18n="ask.label"></label>
            <textarea class="textarea" id="ask-body" maxlength="2000" required data-i18n-ph="ask.ph"></textarea>
            <div class="counter"><span id="askCount">0</span> / 2000</div>
          </div>
          <div class="notice" role="note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
            <p><strong data-i18n="urgent.title"></strong><span data-i18n="urgent.ask"></span></p>
          </div>
          <p class="form-error" id="askError" role="alert"></p>
          <div class="ask-actions">
            <span class="hand" data-i18n="ask.hand"></span>
            <button class="btn btn-primary" type="submit" id="askBtn" data-i18n="ask.btn"></button>
          </div>
        </form>

        <div class="list-head">
          <h2 data-i18n="my.prev"></h2>
          <button class="btn btn-ghost" type="button" id="refreshMy" data-i18n="btn.refresh"></button>
        </div>
        <div class="q-list" id="myList" aria-live="polite"></div>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap">
    <span><span data-i18n="brand.name">أرشديني</span> · <span id="schoolName"></span></span>
    <span class="hand" data-i18n="footer.tag"></span>
  </div>
</footer>

<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const views = document.querySelectorAll("[data-view]");
  const HOME_ANCHORS = ["home", "services", "how", "faq"];
  const PRIVATE_VIEWS = ["my"];
  let user = null;
  let currentView = "home";
  let justCreated = null; // بيانات الحساب الجديد تُعرض مرة واحدة فقط
  let passShown = false;

  if (Api.mode === "demo") $("#demoBar").hidden = false;
  const CFG = window.MURSHIDA_CONFIG || {};

  function schoolName() {
    const n = CFG.SCHOOL_NAME;
    if (getLang() === "en" && (!n || n === "المدرسة")) return "School counseling";
    return n || "المدرسة";
  }

  function toast(msg) {
    const el = $("#toast"); el.textContent = msg; el.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(() => (el.hidden = true), 2600);
  }
  function setBusy(btn, busy, key) {
    btn.disabled = busy;
    if (busy) { btn.dataset.prevKey = btn.dataset.i18n; btn.textContent = t(key); }
    else btn.textContent = t(btn.dataset.i18n);
  }

  function renderHeader() {
    const box = $("#authActions");
    if (user) {
      box.innerHTML = `<a class="btn btn-soft" href="#my">${t("btn.my")}</a>
        <button class="btn btn-ghost" type="button" id="logoutBtn">${t("btn.logout")}</button>`;
      $("#logoutBtn").addEventListener("click", async () => {
        await Api.signOut(); user = null; renderHeader(); location.hash = "#home"; toast(t("toast.loggedOut"));
      });
    } else {
      box.innerHTML = `<a class="btn btn-ghost" href="#login">${t("btn.login")}</a>
        <a class="btn btn-primary" href="#signup">${t("btn.signup")}</a>`;
    }
    document.querySelectorAll("[data-cta]").forEach(a => a.setAttribute("href", user ? "#my" : "#signup"));
    $("#schoolName").textContent = schoolName();
  }

  function route() {
    const id = (location.hash || "#home").slice(1) || "home";
    let view = HOME_ANCHORS.includes(id) ? "home" : id;
    if (!document.querySelector(`[data-view="${view}"]`)) view = "home";
    if (PRIVATE_VIEWS.includes(view) && !user) view = "login";
    if ((view === "signup" || view === "login") && user) view = "my";
    if (view === "welcome" && !justCreated) view = user ? "my" : "home";
    currentView = view;

    views.forEach(v => (v.hidden = v.dataset.view !== view));
    document.querySelectorAll("[data-nav]").forEach(a => {
      const on = view === "home" && a.dataset.nav === (HOME_ANCHORS.includes(id) ? id : "home");
      if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });

    if (view === "home") {
      const el = id !== "home" ? document.getElementById(id) : null;
      if (el) el.scrollIntoView({ block: "start" }); else window.scrollTo(0, 0);
    } else {
      window.scrollTo(0, 0);
    }
    if (view === "my") { $("#myName").textContent = user.username; loadMy(); }
    if (view === "welcome") showWelcome();
  }

  // ---------- إنشاء حساب ----------
  $("#signupForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("#signupError"); err.textContent = "";
    const u = $("#su-username").value, p = $("#su-password").value, p2 = $("#su-password2").value;
    if (!u.trim()) return (err.textContent = t("err.enterUser"));
    if (p !== p2) return (err.textContent = t("err.passMismatch"));
    if (!$("#su-agree").checked) return (err.textContent = t("err.mustAgree"));
    const btn = $("#signupBtn"); setBusy(btn, true, "signup.busy");
    try {
      user = await Api.signUpStudent(u, p);
      justCreated = { username: user.username, password: p };
      e.target.reset();
      renderHeader();
      location.hash = "#welcome";
    } catch (ex) { err.textContent = ex.message; }
    finally { setBusy(btn, false); }
  });

  // ---------- شاشة حفظ البيانات ----------
  function paintPass() {
    $("#wPass").textContent = passShown ? justCreated.password : "••••••••";
    $("#togglePass").textContent = passShown ? t("welcome.hide") : t("welcome.show");
  }
  function showWelcome() {
    $("#wUser").textContent = justCreated.username;
    passShown = false; paintPass();
    $("#w-saved").checked = false; $("#wContinue").disabled = true;
  }
  $("#togglePass").addEventListener("click", () => { passShown = !passShown; paintPass(); });
  $("#copyCreds").addEventListener("click", () => {
    const text = t("welcome.copyText", { u: justCreated.username, p: justCreated.password });
    try {
      navigator.clipboard.writeText(text).then(() => toast(t("toast.copied")), () => toast(t("toast.copyFail")));
    } catch (e) { toast(t("toast.copyFail")); }
  });
  $("#w-saved").addEventListener("change", (e) => ($("#wContinue").disabled = !e.target.checked));
  $("#wContinue").addEventListener("click", () => { justCreated = null; location.hash = "#my"; });

  // ---------- تسجيل الدخول ----------
  $("#loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("#loginError"); err.textContent = "";
    const u = $("#li-username").value, p = $("#li-password").value;
    if (!u.trim() || !p) return (err.textContent = t("err.enterBoth"));
    const btn = $("#loginBtn"); setBusy(btn, true, "login.busy");
    try {
      user = await Api.signInStudent(u, p);
      e.target.reset(); renderHeader(); location.hash = "#my";
    } catch (ex) { err.textContent = ex.message; }
    finally { setBusy(btn, false); }
  });

  // ---------- أسئلتي ----------
  const askBody = $("#ask-body");
  askBody.addEventListener("input", () => ($("#askCount").textContent = askBody.value.length));

  $("#askForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("#askError"); err.textContent = "";
    const btn = $("#askBtn"); setBusy(btn, true, "ask.busy");
    try {
      await Api.askQuestion(askBody.value);
      askBody.value = ""; $("#askCount").textContent = "0";
      toast(t("toast.sent"));
      loadMy();
    } catch (ex) { err.textContent = ex.message; }
    finally { setBusy(btn, false); }
  });
  $("#refreshMy").addEventListener("click", loadMy);

  let myCache = null;
  async function loadMy() {
    const list = $("#myList");
    list.innerHTML = `<div class="empty">${t("loading")}</div>`;
    try { myCache = await Api.myQuestions(); paintMy(); }
    catch (ex) { list.innerHTML = `<div class="empty">${escapeHtml(ex.message)}</div>`; }
  }
  function paintMy() {
    const list = $("#myList");
    if (!myCache) return;
    if (!myCache.length) {
      list.innerHTML = `<div class="empty"><span class="hand">${t("my.emptyT")}</span>${t("my.emptyB")}</div>`;
      return;
    }
    list.innerHTML = myCache.map(q => `
      <article class="q-card">
        <div class="q-meta">
          <span>${escapeHtml(formatDate(q.created_at))}</span>
          ${q.status === "answered"
            ? `<span class="chip chip-done">${t("status.done")}</span>`
            : `<span class="chip chip-new">${t("status.new")}</span>`}
        </div>
        <p class="q-body" dir="auto">${escapeHtml(q.body)}</p>
        ${q.reply ? `<div class="q-reply"><span class="who-replied">${t("reply.from")}${q.replied_at ? " · " + escapeHtml(formatDate(q.replied_at)) : ""}</span><p dir="auto">${escapeHtml(q.reply)}</p></div>` : ""}
      </article>`).join("");
  }

  // ---------- تغيير اللغة ----------
  window.addEventListener("langchange", () => {
    renderHeader();
    if (currentView === "my") paintMy();
    if (currentView === "welcome" && justCreated) paintPass();
    ["#signupError", "#loginError", "#askError"].forEach(s => ($(s).textContent = ""));
  });

  // ---------- تشغيل ----------
  window.addEventListener("hashchange", route);
  (async () => {
    try { user = await Api.currentUser(); } catch (e) { user = null; }
    // حساب المرشدة لا يدخل صفحة الطالبات
    if (user && await Api.isCounselor()) { await Api.signOut(); user = null; }
    renderHeader();
    route();
  })();
})();
</script>
</body>
</html>
